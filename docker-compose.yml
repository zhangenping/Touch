# 本地 / VPS：PostgreSQL + 全栈应用
# 仅启动数据库：docker compose up db -d
# 数据库可视化：docker compose up db pgadmin -d → http://localhost:5050
# 完整部署：docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: touch
      POSTGRES_PASSWORD: touch_secret
      POSTGRES_DB: touch
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U touch -d touch']
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - '5050:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@touch.local
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-please-set-a-strong-secret}
      DATABASE_URL: postgresql://touch:touch_secret@db:5432/touch?schema=public
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  pgadmin_data:
